<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anime Finder</title>

  <!-- Bootstrap 5 -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar bg-body-tertiary border-bottom">
    <div class="container">
      <span class="navbar-brand mb-0 h1">🎌 Anime Finder</span>
      <span class="navbar-text d-none d-sm-inline">Data: Kitsu API</span>
    </div>
  </nav>

  <main class="container py-4">

    <!-- Search form -->
    <form id="search-form" class="row g-2 mb-3">
      <div class="col-12 col-md">
        <input type="text" id="search-input" class="form-control form-control-lg"
               placeholder="Search anime... (e.g. Naruto)" aria-label="Search anime">
      </div>
      <div class="col-7 col-md-3">
        <select id="type-select" class="form-select form-select-lg" aria-label="Type">
          <option value="">All types</option>
          <option value="TV">TV</option>
          <option value="movie">Movie</option>
          <option value="OVA">OVA</option>
        </select>
      </div>
      <div class="col-5 col-md-auto">
        <button type="submit" class="btn btn-primary btn-lg w-100">Search</button>
      </div>
    </form>

    <h2 id="heading" class="h4 mb-3"></h2>

    <!-- Loading and error messages -->
    <div id="spinner" class="text-center my-5 d-none">
      <div class="spinner-border" role="status"><span class="visually-hidden">Loading...</span></div>
    </div>
    <div id="message" class="alert d-none" role="alert"></div>

    <!-- Result cards -->
    <div id="results" class="row row-cols-2 row-cols-md-3 row-cols-lg-4 g-3"></div>
  </main>

  <!-- Details modal -->
  <div class="modal fade" id="detail-modal" tabindex="-1" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-scrollable">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="modal-title"></h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="modal-body"></div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
